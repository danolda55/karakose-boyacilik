name: Siteyi derle ve cPanel'e yükle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Siteyi derle (dist/)
        run: python3 build.py
      - name: PHP sözdizimi kontrolü
        run: for f in server/*.php; do php -l "$f"; done
      - name: Gönderim anahtarlarını yaz (repoda yok)
        env:
          IR_KEY: ${{ secrets.INFINIREACH_API_KEY }}
          APP_PIN: ${{ secrets.APP_PIN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          cfg = json.load(open("config.json", encoding="utf-8"))
          data = {"key": os.environ.get("IR_KEY", ""), "pin": os.environ.get("APP_PIN", ""),
                  "from": "+" + cfg["phoneIntl"], "channels": ["whatsapp", "sms"],
                  "reviewUrl": cfg.get("appReviewUrl") or cfg["reviewUrl"]}
          b = base64.b64encode(json.dumps(data).encode()).decode()
          out = pathlib.Path("dist") / cfg["appPath"].strip("/") / ".htsecrets.php"
          out.write_text("<?php return json_decode(base64_decode('" + b + "'), true);\n")
          print("yazıldı:", out, "anahtar var" if data["key"] else "ANAHTAR YOK", "pin var" if data["pin"] else "PIN YOK")
          PY
      - name: FTP ile public_html'e gönder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          timeout: 60000
      - name: Canlı siteyi kontrol et
        run: |
          for p in / /hizmetlerimiz/ /esyali-ev-boyama/ /isicilik-hesapla/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://xn--karakseboyaclk-zpb56gba.com.tr$p")
            echo "$p -> $code"; [ "$code" = "200" ] || exit 1
          done
